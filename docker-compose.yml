services:
  # -------------------------------------------------------------
  # HireFlow AI Backend (FastAPI + Alembic)
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow_backend
    # network_mode: host allows:
    # 1. Direct connection to your local pgAdmin PostgreSQL via 127.0.0.1:5432
    # 2. Seamless connection to cloud databases like Neon (ep-xyz.neon.tech) in the future
    # 3. Direct access to port 8000 without port forwarding overhead
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Please set DATABASE_URL in your .env file}
      SECRET_KEY: ${SECRET_KEY:-hireflow_ai_super_secret_key_2026_change_in_production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      DEBUG: ${DEBUG:-true}
      RPA_ENABLED: ${RPA_ENABLED:-false}
      RPA_HEADLESS: ${RPA_HEADLESS:-true}
      HF_BASE_URL: ${HF_BASE_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
