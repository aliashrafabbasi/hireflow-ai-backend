# Development override: make the API use PostgreSQL already running on the host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build
services:
  api:
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env before starting Docker Compose}
    ports: !reset []
    extra_hosts: !reset []
